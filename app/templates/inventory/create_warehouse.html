{% extends "base.html" %}
{% block title %}Add Warehouse{% endblock %}
{% block page_title %}Add Warehouse{% endblock %}

{% block content %}
<div class="page-header">
  <h2>Add New Warehouse</h2>
  <a href="{{ url_for('inventory.warehouses') }}" class="btn btn-outline">← Back</a>
</div>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card" style="max-width:680px;">
  <div class="card-body">
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label>Warehouse Name <span class="required">*</span></label>
        <input type="text" name="name" class="form-control" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Code <span class="required">*</span> <small>(e.g. WH-KN-01)</small></label>
          <input type="text" name="code" class="form-control" required />
        </div>
        <div class="form-group">
          <label>State <span class="required">*</span></label>
          <select name="state_id" class="form-control" required>
            <option value="">Select State…</option>
            {% for s in states %}
              <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address" class="form-control" rows="2"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Latitude</label>
          <input type="number" name="latitude" class="form-control" step="0.0001" />
        </div>
        <div class="form-group">
          <label>Longitude</label>
          <input type="number" name="longitude" class="form-control" step="0.0001" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Capacity (tonnes)</label>
          <input type="number" name="capacity_tonnes" class="form-control" step="0.1" />
        </div>
        <div class="form-group">
          <label>Manager Name</label>
          <input type="text" name="manager_name" class="form-control" />
        </div>
      </div>
      <div class="form-group">
        <label>Manager Phone</label>
        <input type="tel" name="manager_phone" class="form-control" />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Create Warehouse</button>
        <a href="{{ url_for('inventory.warehouses') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
