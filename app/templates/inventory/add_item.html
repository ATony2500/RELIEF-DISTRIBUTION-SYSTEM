{% extends "base.html" %}
{% block title %}Add Inventory Item{% endblock %}
{% block page_title %}Add Inventory Item{% endblock %}

{% block content %}
<div class="page-header">
  <h2>Add Inventory Item</h2>
  <a href="{{ url_for('inventory.item_list') }}" class="btn btn-outline">← Back</a>
</div>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card" style="max-width:680px;">
  <div class="card-body">
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-row">
        <div class="form-group">
          <label>Warehouse <span class="required">*</span></label>
          <select name="warehouse_id" class="form-control" required>
            <option value="">Select Warehouse…</option>
            {% for wh in warehouses %}
              <option value="{{ wh.id }}">{{ wh.name }} ({{ wh.code }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Category <span class="required">*</span></label>
          <select name="category" class="form-control" required>
            <option value="">Select…</option>
            {% for cat in ['Food','Water','Medicine','Shelter','Clothing','Hygiene','Other'] %}
              <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Item Name <span class="required">*</span></label>
        <input type="text" name="item_name" class="form-control" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Initial Quantity <span class="required">*</span></label>
          <input type="number" name="quantity_available" class="form-control" step="0.1" min="0" value="0" required />
        </div>
        <div class="form-group">
          <label>Unit <span class="required">*</span></label>
          <input type="text" name="unit" class="form-control" placeholder="e.g. kg, bags, units" required value="units" />
        </div>
      </div>
      <div class="form-group">
        <label>Minimum Threshold (for low-stock alert)</label>
        <input type="number" name="minimum_threshold" class="form-control" step="0.1" min="0" value="0" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Donor / Source</label>
          <input type="text" name="donor" class="form-control" />
        </div>
        <div class="form-group">
          <label>Batch / Lot Number</label>
          <input type="text" name="batch_number" class="form-control" />
        </div>
      </div>
      <div class="form-group">
        <label>Expiry Date</label>
        <input type="date" name="expiry_date" class="form-control" />
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" class="form-control" rows="2"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Add Item</button>
        <a href="{{ url_for('inventory.item_list') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
