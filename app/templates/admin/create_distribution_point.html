{% extends "base.html" %}
{% block title %}Add Distribution Point{% endblock %}
{% block page_title %}Add Distribution Point{% endblock %}

{% block content %}
<div class="page-header">
  <h2>Add Distribution Point</h2>
  <a href="{{ url_for('admin.distribution_points') }}" class="btn btn-outline">← Back</a>
</div>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card" style="max-width:680px;">
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label>Name <span class="required">*</span></label>
        <input type="text" name="name" class="form-control" required />
      </div>
      <div class="form-group">
        <label>LGA <span class="required">*</span></label>
        <select name="lga_id" class="form-control" required>
          <option value="">Select LGA…</option>
          {% for lga in lgas %}
            <option value="{{ lga.id }}">{{ lga.name }} ({{ lga.state.name }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address" class="form-control" rows="2"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Latitude <span class="required">*</span></label>
          <input type="number" name="latitude" class="form-control" step="0.0001" required />
        </div>
        <div class="form-group">
          <label>Longitude <span class="required">*</span></label>
          <input type="number" name="longitude" class="form-control" step="0.0001" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Capacity (beneficiaries/day)</label>
          <input type="number" name="capacity" class="form-control" min="1" />
        </div>
        <div class="form-group">
          <label>Contact Person</label>
          <input type="text" name="contact_person" class="form-control" />
        </div>
      </div>
      <div class="form-group">
        <label>Contact Phone</label>
        <input type="tel" name="contact_phone" class="form-control" />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Add Distribution Point</button>
        <a href="{{ url_for('admin.distribution_points') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
