{% extends "base.html" %}
{% block title %}Add NIN Record{% endblock %}
{% block page_title %}Add NIN Record{% endblock %}

{% block content %}
<div class="page-header">
  <h2>Add NIN Record</h2>
  <a href="{{ url_for('admin.nin_registry') }}" class="btn btn-outline">← Registry</a>
</div>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card" style="max-width:680px;">
  <div class="card-body">
    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label>National Identification Number (NIN) <span class="required">*</span></label>
        <input type="text" name="nin" class="form-control"
               placeholder="11-digit NIN" maxlength="11" pattern="\d{11}"
               required inputmode="numeric" value="{{ request.form.get('nin','') }}" />
        <div class="form-hint text-muted">Raw NIN is hashed on save and never stored in plaintext.</div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>First Name <span class="required">*</span></label>
          <input type="text" name="firstname" class="form-control" required
                 value="{{ request.form.get('firstname','') }}" />
        </div>
        <div class="form-group">
          <label>Last Name <span class="required">*</span></label>
          <input type="text" name="lastname" class="form-control" required
                 value="{{ request.form.get('lastname','') }}" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Middle Name</label>
          <input type="text" name="middlename" class="form-control"
                 value="{{ request.form.get('middlename','') }}" />
        </div>
        <div class="form-group">
          <label>Gender <span class="required">*</span></label>
          <select name="gender" class="form-control" required>
            <option value="">Select…</option>
            {% for g in ['Male','Female','Other'] %}
              <option value="{{ g }}" {% if request.form.get('gender') == g %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date of Birth <small class="text-muted">(DD-MM-YYYY)</small></label>
          <input type="text" name="birthdate" class="form-control"
                 placeholder="04-04-1944"
                 value="{{ request.form.get('birthdate','') }}" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone" class="form-control"
                 value="{{ request.form.get('phone','') }}" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>State of Origin</label>
          <input type="text" name="state_of_origin" class="form-control"
                 value="{{ request.form.get('state_of_origin','') }}" />
        </div>
        <div class="form-group">
          <label>LGA of Origin</label>
          <input type="text" name="lga_of_origin" class="form-control"
                 value="{{ request.form.get('lga_of_origin','') }}" />
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Save Record</button>
        <a href="{{ url_for('admin.nin_registry') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
