{% extends "base.html" %}
{% block title %}Create User{% endblock %}
{% block page_title %}Create User{% endblock %}

{% block content %}
<div class="page-header">
  <h2>Create New User</h2>
  <a href="{{ url_for('admin.user_list') }}" class="btn btn-outline">← Back</a>
</div>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card" style="max-width:680px;">
  <div class="card-body">
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-row">
        <div class="form-group">
          <label>Username <span class="required">*</span></label>
          <input type="text" name="username" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input type="email" name="email" class="form-control" required />
        </div>
      </div>
      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" name="full_name" class="form-control" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Role <span class="required">*</span></label>
          <select name="role" class="form-control" required>
            <option value="field_officer">Field Officer</option>
            <option value="warehouse">Warehouse Staff</option>
            <option value="logistics">Logistics Officer</option>
            <option value="programme_coord">Programme Coordinator</option>
            <option value="partner">Partner Organisation</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div class="form-group">
          <label>State</label>
          <select name="state_id" class="form-control">
            <option value="">Select State…</option>
            {% for s in states %}
              <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone" class="form-control" />
        </div>
        <div class="form-group">
          <label>Organisation</label>
          <input type="text" name="organisation" class="form-control" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <input type="password" name="password" class="form-control" required minlength="8" />
        </div>
        <div class="form-group">
          <label>Confirm Password <span class="required">*</span></label>
          <input type="password" name="confirm_password" class="form-control" required minlength="8" />
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Create User</button>
        <a href="{{ url_for('admin.user_list') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
