{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}

{% block content %}
<div class="page-header">
  <h2>My Profile</h2>
  <a href="{{ url_for('auth.change_password') }}" class="btn btn-outline">Change Password</a>
</div>

<div class="card-grid">
  <div class="card">
    <div class="card-header"><h3>Account Information</h3></div>
    <div class="card-body">
      <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name }}" required />
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" value="{{ current_user.username }}" disabled />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" value="{{ current_user.email }}" disabled />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone" class="form-control" value="{{ current_user.phone or '' }}" />
        </div>
        <div class="form-group">
          <label>Organisation</label>
          <input type="text" name="organisation" class="form-control" value="{{ current_user.organisation or '' }}" />
        </div>
        <div class="form-group">
          <label>Role</label>
          <input type="text" class="form-control" value="{{ current_user.role | replace('_', ' ') | title }}" disabled />
        </div>
        <div class="form-group">
          <label>Last Login</label>
          <input type="text" class="form-control" value="{{ current_user.last_login.strftime('%d %b %Y, %H:%M') if current_user.last_login else 'N/A' }}" disabled />
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
