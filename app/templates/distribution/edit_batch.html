{% extends "base.html" %}
{% block title %}Edit {{ batch.batch_code }}{% endblock %}
{% block page_title %}Edit Distribution Batch{% endblock %}

{% block content %}
<div class="page-header">
  <h2>Edit — <code>{{ batch.batch_code }}</code></h2>
  <a href="{{ url_for('distribution.batch_detail', batch_id=batch.id) }}"
     class="btn btn-outline">← Back</a>
</div>

{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card" style="max-width:680px;">
  <div class="card-body">
    <form method="POST" action="{{ url_for('distribution.edit_batch', batch_id=batch.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label>Batch Title <span class="required">*</span></label>
        <input type="text" name="title" class="form-control" required
               value="{{ request.form.get('title', batch.title) }}" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Disaster Type <span class="required">*</span></label>
          <select name="disaster_type" class="form-control" required>
            <option value="">Select…</option>
            {% for dt in ['Flood','Conflict','Epidemic','Drought','Other'] %}
              <option value="{{ dt }}"
                {% if request.form.get('disaster_type', batch.disaster_type) == dt %}selected{% endif %}>
                {{ dt }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Planned Date <span class="required">*</span></label>
          <input type="date" name="planned_date" class="form-control" required
                 value="{{ request.form.get('planned_date', batch.planned_date.strftime('%Y-%m-%d')) }}" />
        </div>
      </div>

      <div class="form-group">
        <label>Source Warehouse <span class="required">*</span></label>
        <select name="source_warehouse_id" class="form-control" required>
          <option value="">Select Warehouse…</option>
          {% for wh in warehouses %}
            <option value="{{ wh.id }}"
              {% if request.form.get('source_warehouse_id', batch.source_warehouse_id|string) == wh.id|string %}selected{% endif %}>
              {{ wh.name }} ({{ wh.code }})
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" class="form-control" rows="3">{{ request.form.get('description', batch.description or '') }}</textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Save Changes</button>
        <a href="{{ url_for('distribution.batch_detail', batch_id=batch.id) }}"
           class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
