{% extends "base.html" %}
{% block title %}New Distribution Batch{% endblock %}
{% block page_title %}Create Distribution Batch{% endblock %}

{% block content %}
<div class="page-header">
  <h2>New Distribution Batch</h2>
  <a href="{{ url_for('distribution.batch_list') }}" class="btn btn-outline">← Back</a>
</div>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card" style="max-width:680px;">
  <div class="card-body">
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label>Batch Title <span class="required">*</span></label>
        <input type="text" name="title" class="form-control" required
               placeholder="e.g. 2026 Flood Response — Kogi State" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Disaster Type <span class="required">*</span></label>
          <select name="disaster_type" class="form-control" required>
            <option value="">Select…</option>
            {% for dt in ['Flood','Conflict','Epidemic','Drought','Other'] %}
              <option value="{{ dt }}">{{ dt }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Planned Date <span class="required">*</span></label>
          <input type="date" name="planned_date" class="form-control" required />
        </div>
      </div>
      <div class="form-group">
        <label>Source Warehouse <span class="required">*</span></label>
        <select name="source_warehouse_id" class="form-control" required>
          <option value="">Select Warehouse…</option>
          {% for wh in warehouses %}
            <option value="{{ wh.id }}">{{ wh.name }} ({{ wh.code }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Create Batch</button>
        <a href="{{ url_for('distribution.batch_list') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
